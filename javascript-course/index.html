<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>JavaScript Course</title>
  <link rel="stylesheet" href="../css/global.css">
</head>

<body>

  <h1>JavaScript Course Files</h1>

<div class="button-container">
    <button onclick="runFile('01-js-fundamentals.js')">01 - Fundamentals</button>
    <button onclick="runFile('02-functions.js')">02 - Functions</button>
    <button onclick="runFile('03-functions-calling-functions.js')">03 - Calling Functions</button>
    <button onclick="runFile('04-if-else.js')">04 - If/Else</button>
    <button onclick="runFile('05-boolean-log-operators.js')">05 - Boolean Operators</button>
    <button onclick="runFile('06-equality-operator.js')">06 - Equality Operator</button>
    <button onclick="runFile('07-truthy-falsy-values.js')">07 - Truthy/Falsy</button>
    <button onclick="runFile('08-type-conversion-coercion.js')">08 - Type Conversion</button>
    <button onclick="runFile('09-arrays-data-structure.js')">09 - Arrays Data Structure</button>
    <button onclick="runFile('10-array-methods.js')">10 - Array Methods</button>
    <button onclick="runFile('11-objects-basics.js')">11 - Objects Basics</button>
    <button onclick="runFile('12-loops.js')">12 - Loops</button>
    <button onclick="runFile('13-statementsAndExpressions-Ternary.js')">13 - Ternary</button>
    <button onclick="runFile('14-switch-statements.js')">14 - Switch</button>
    <button onclick="runFile('15-debugging-practice.js')">15 - Debugging Practice</button>
    <button onclick="window.location.href='javascript-reference.html'">16 - JavaScript Reference</button>
    <button onclick="window.location.href='web-dev-reference.html'">17 - Web Dev Reference</button>
</div>

  <p id="status">Click a lesson to run it (check Console).</p>

<script>
  async function runFile(fileName) {
    // ✅ If it's an HTML page, OPEN it (don't fetch/eval)
    if (fileName.endsWith(".html")) {
      window.location.href = fileName;
      return;
    }

    // Update status
    document.getElementById("status").textContent = `Running: ${fileName} (check Console)`;

    // Fetch the JS file as text
    const response = await fetch(fileName);
    const code = await response.text();

    // Wrap the code so variables don't leak globally
    const wrapped = `(function(){\n${code}\n})();`;

    // Run it
    try {
      eval(wrapped);
    } catch (err) {
      console.error("Lesson error:", err);
    }
  }
</script>


</body>
</html>
