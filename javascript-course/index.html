<!DOCTYPE html>
<!-- Tells the browser this is an HTML5 document -->

<html lang="en">
<!-- Root element of the page. lang="en" helps accessibility and SEO -->

<head>
    <!-- Head contains metadata (not visible on page) -->

    <meta charset="UTF-8">
    <!-- Defines character encoding (supports normal letters, symbols, etc.) -->

    <title>JavaScript Practice</title>
    <!-- Text shown in browser tab -->

    <link rel="stylesheet" href="style.css">
    <!-- Links external CSS file for styling -->
</head>

<body>
    <!-- Body contains visible content -->

    <h1>JavaScript Practice Page</h1>
    <!-- Main heading -->

    <p id="message">Click the button</p>
    <!-- Paragraph element. id="message" allows JavaScript to select it -->

    <button id="btn">Click Me</button>
    <!-- Button element. id="btn" allows JavaScript to select it -->

    <script src="06-equality-operator.js"></script>
    <!-- Links external JavaScript file -->
    <!-- Placed at bottom so HTML loads before JS runs -->

</body>
</html>
