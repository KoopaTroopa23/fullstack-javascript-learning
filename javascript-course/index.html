<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>JavaScript Course</title>
  <link rel="stylesheet" href="../css/global.css">
</head>

<body>

  <h1>JavaScript Course Files</h1>

<div class="button-container">
    <button onclick="runFile('01-functions.js')">01 - Functions</button>
    <button onclick="runFile('02-js-fundamentals.js')">02 - Fundamentals</button>
    <button onclick="runFile('03-truthy-falsy-values.js')">03 - Truthy/Falsy</button>
    <button onclick="runFile('04-boolean-log-operators.js')">04 - Boolean Operators</button>
    <button onclick="runFile('05-if-else.js')">05 - If/Else</button>
    <button onclick="runFile('06-equality-operator.js')">06 - Equality Operator</button>
    <button onclick="runFile('07-type-conversion-coercion.js')">07 - Type Conversion</button>
    <button onclick="runFile('08-objects-basics.js')">08 - Objects Basics</button>
    <button onclick="runFile('09-statementsAndExpressions-Ternary.js')">09 - Ternary</button>
    <button onclick="runFile('10-switch-statements.js')">10 - Switch</button>
    <button onclick="runFile('11-debugging-practice.js')">11 - Debugging Practice</button>
</div>

  <p id="status">Click a lesson to run it (check Console).</p>

<script>
  async function runFile(fileName) {
    // Update status
    document.getElementById("status").textContent = `Running: ${fileName} (check Console)`;

    // Fetch the JS file as text
    const response = await fetch(fileName);
    const code = await response.text();

    // Wrap the code so variables don't leak globally
    const wrapped = `(function(){\n${code}\n})();`;

    // Run it
    try {
      eval(wrapped);
    } catch (err) {
      console.error("Lesson error:", err);
    }
  }
</script>


</body>
</html>
